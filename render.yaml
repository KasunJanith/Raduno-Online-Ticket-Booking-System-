services:
  - type: web
    name: raduno-26-ticketing
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: raduno-db
          property: connectionString
      - key: NEXT_PUBLIC_SITE_URL
        value: https://raduno-26-ticketing.onrender.com
      - key: ADMIN_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: raduno-db
    databaseName: raduno26
    user: raduno_user
    region: singapore
